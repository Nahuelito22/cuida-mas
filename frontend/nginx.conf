server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad para la SPA.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

  # El navegador solo habla con nginx: las llamadas a la API se reenvían al gateway
  # dentro de la red de Docker (sin problemas de CORS ni URLs fijas en el build).
  location /api/ {
    proxy_pass http://api-gateway:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /graphql {
    proxy_pass http://api-gateway:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Archivos con hash en el nombre: se pueden cachear por mucho tiempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rutas de React Router: cualquier ruta desconocida devuelve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
